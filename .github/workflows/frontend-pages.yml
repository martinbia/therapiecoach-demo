name: Frontend CI and GitHub Pages
on:
  push:
    branches: [main, frontend]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'agent/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/frontend-pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'worker/**'
      - 'agent/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # After npm-generated package-lock.json is committed, switch to npm ci.
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Contract and state tests
        run: npm test
      - name: Verify API contract across web, worker and agent (offline)
        working-directory: .
        run: |
          python3 agent/verify_agent_contract.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/preflight.py --root .
      - name: Install Worker development dependencies (no deployment)
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Worker TypeScript and security/rate-limit tests
        working-directory: worker
        run: npm run check
      - name: Full offline HTTP/Token/SDK/Dispatcher integration
        working-directory: .
        run: node --experimental-loader ./web/tests/sdk-mock-loader.mjs --experimental-transform-types --test tests/end_to_end.test.mjs
      - name: Build static PWA
        env:
          VITE_VOICE_MODE: ${{ vars.VITE_VOICE_MODE || 'mock' }}
          VITE_WORKER_BASE_URL: ${{ vars.VITE_WORKER_BASE_URL || '' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Upload dist for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
