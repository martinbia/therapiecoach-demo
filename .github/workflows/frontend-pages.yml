name: Frontend CI and GitHub Pages
on:
  push:
    branches: [main, frontend]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The source ZIP is intentionally delivered without a fabricated lockfile.
      # Commit the npm-generated package-lock.json after the first successful install,
      # then switch this step to npm ci for fully reproducible installs.
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Contract and state tests
        run: npm test
      - name: Build static PWA
        env:
          VITE_VOICE_MODE: ${{ vars.VITE_VOICE_MODE || 'mock' }}
          VITE_WORKER_BASE_URL: ${{ vars.VITE_WORKER_BASE_URL || '' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Upload dist for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
